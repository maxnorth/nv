name: "CI Checks"
on:
  workflow_dispatch:
  push:

jobs:
  run-ci:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
          - runner: macos-latest
            goos: darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install mise
        uses: jdx/mise-action@v2
      - name: Build CLI
        run: mise run build
      - name: Run tests
        run: mise run test
